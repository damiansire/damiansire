name: Hygiene Gate

# Gate preventivo global (roastme 2026-07-17, items 1.3d + 3.3e): falla si queda
# trackeado un archivo que nunca deberia publicarse (variantes de .env, claves,
# .npmrc) o un descartable de sesion (claude-scratch-*, claude-orch-*, temp_*,
# rewrite<N>.py). Higiene dependiente del gate, no del habito.
#
# La logica vive en scripts/hygiene-check.sh para que corra igual en local
# (`pnpm hygiene`) y para que exista un self-test que la ejercite RECHAZANDO:
# el step de abajo falla si el gate deja de gatear.
#
# Cubre tres capas: nombres trackeados, contenido (tokens con formato conocido
# y raya em) e historial completo (nombres y tokens en todos los commits; por
# eso el checkout trae fetch-depth: 0). Lo que NO garantiza: la capa de
# contenido reconoce formatos de token, no entropia arbitraria.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: hygiene-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Historial completo: la capa 3 del gate escanea todos los commits.
          fetch-depth: 0

      - name: Self-test del gate (falla si el gate dejo de gatear)
        shell: bash
        run: bash scripts/hygiene-check.test.sh

      - name: Sin credenciales ni descartables trackeados
        shell: bash
        run: bash scripts/hygiene-check.sh
